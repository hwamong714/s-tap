name: s_tap
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/conversation/backgrounds/
    - assets/conversation/characters/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/s_tap_icon.png"
  min_sdk_android: 21